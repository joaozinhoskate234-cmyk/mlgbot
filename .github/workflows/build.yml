name: Compilar MLGBot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Guardar o Spigot 1.8.8 em cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-1.8.8

      - name: Gerar o Spigot 1.8.8 (BuildTools, demora alguns minutos)
        run: |
          if [ ! -d ~/.m2/repository/org/spigotmc/spigot/1.8.8-R0.1-SNAPSHOT ]; then
            mkdir -p ~/bt && cd ~/bt
            curl -L -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
            java -jar BuildTools.jar --rev 1.8.8
          fi

      - name: Compilar o plugin
        run: mvn -B package

      - name: Guardar o MLGBot.jar
        uses: actions/upload-artifact@v4
        with:
          name: MLGBot
          path: target/MLGBot.jar
