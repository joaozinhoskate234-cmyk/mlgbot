name: MLGBot
version: 1.0.0
main: me.mlgbot.MLGBotPlugin
author: Servidor
description: Bot de treino de MLG Rush que copia seus movimentos, pulos e golpes
commands:
  bot:
    description: Controla o seu bot de treino
    usage: /bot <spawn|remove|reload>
    aliases: [mlgbot]
permissions:
  mlgbot.use:
    description: Permite usar /bot spawn e /bot remove
    default: true
  mlgbot.admin:
    description: Permite usar /bot reload
    default: op
